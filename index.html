<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF6EC">
<title>梦女契合度测试｜你和老公的心动解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#FF6FA0;
  --teal-deep:#DA568B;
  --pink:#8CA33E;
  --pink-deep:#A4565C;
  --peach:#FFE3EA;
  --peach-deep:#F5C2CB;
  --white:#FFFFFF;
  --ink:#4A2430;
  --muted:#B98995;
  --bg:#FFF6F8;
  --paper:#FFFEFC;
  --line:#F7DCE3;
  --shadow:0 18px 46px rgba(166,60,100,.14);
  --r-lg:28px;
  --r-md:20px;
  --r-sm:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.disp{font-family:'Poppins','Noto Sans SC',sans-serif}
button{font:inherit}
.wrap{width:min(480px,100%);margin:0 auto;padding:20px 16px 40px}
.hidden{display:none!important}

.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-deep);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}

.btn{border:none;border-radius:999px;padding:15px 20px;font-weight:700;font-size:15px;cursor:pointer;width:100%;transition:.15s;letter-spacing:.01em}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.32;cursor:not-allowed}
.btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:active{transform:scale(.98)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

.cover-top{padding:22px 2px 6px;text-align:center}
.cover-top h1{font-size:clamp(28px,8.6vw,38px);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.15}
.cover-desc{color:#7A5560;font-size:13.5px;margin:10px 6px 0}

.name-card{margin-top:18px;background:var(--teal-deep);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.name-card .eyebrow{color:var(--peach)}
.name-card h3{color:#fff;font-size:16px;margin:6px 0 14px;font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:#FFEAF1;margin-bottom:6px;letter-spacing:.04em}
.field input{width:100%;border:none;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.94);color:var(--ink)}
.field input::placeholder{color:#C79AA3;font-weight:500}
.name-card .btn{margin-top:6px;background:#FFEAF1;color:var(--teal-deep)}

.dims-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dims-preview span{font-size:11.5px;font-weight:700;color:var(--teal-deep);background:#FFEAF1;border:1px solid var(--line);border-radius:999px;padding:6px 12px}

.progressBox{position:sticky;top:0;z-index:20;background:rgba(251,248,237,.92);backdrop-filter:blur(12px);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.progressTop{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:7px}
.progressTop .who{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.who i{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:.35s}

.qcard{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.qcard .tag{display:inline-block;background:var(--peach);color:var(--pink-deep);font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 11px;border-radius:999px;margin-bottom:12px}
.qnum{font-size:11px;color:#C79AA3;margin-bottom:6px}
.question{font-size:19px;line-height:1.5;font-weight:700;letter-spacing:-.01em;margin:2px 0 18px}
.option{width:100%;text-align:left;border:1.5px solid var(--line);background:#FFFEFA;border-radius:16px;padding:13px 14px;margin:8px 0;cursor:pointer;display:flex;align-items:flex-start;gap:11px;color:var(--ink);transition:.15s}
.option:active{transform:scale(.99)}
.option .idx{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.option.selected{background:#FFEAF1;border-color:var(--teal)}
.option.selected .idx{background:var(--teal);color:#fff}

.trans-card{margin-top:8px;background:var(--teal);border-radius:var(--r-lg);padding:30px 22px;text-align:center;color:#fff;box-shadow:var(--shadow)}
.trans-card h2{font-size:22px;margin:0 0 8px;font-weight:800}
.trans-card p{margin:0;font-size:13.5px;color:#FFEAF1}
.trans-card .btn{margin-top:20px;background:#fff;color:var(--teal-deep)}

.res-hero{margin-top:6px;background:var(--teal-deep);border-radius:30px;padding:28px 24px;color:#fff;box-shadow:var(--shadow)}
.res-hero .eyebrow{color:var(--peach)}
.res-hero h2{font-size:clamp(24px,7.6vw,30px);font-weight:800;letter-spacing:-.02em;margin:8px 0 6px}
.res-hero .pair{font-size:12.5px;color:#FFEAF1;margin:0 0 10px}
.res-hero .tagline{font-size:14px;color:#FFF0F5;margin:0;line-height:1.6}

.sectionTitle{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep);font-weight:800;margin:26px 2px 10px}

.dim-block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;margin-bottom:10px}
.dim-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.dim-head b{font-size:13.5px}
.dim-head span{font-size:10.5px;color:var(--muted)}
.dim-row{display:flex;align-items:center;gap:9px;margin:7px 0}
.dim-row .who{flex:none;width:52px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.meter.teal i{background:var(--teal)}
.meter.pink i{background:var(--pink)}
.dim-row .pct{flex:none;width:34px;text-align:right;font-size:11px;color:var(--muted);font-weight:700}

.info-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:17px 18px;margin-bottom:10px}
.info-card b{display:block;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
.info-card p{margin:0;font-size:13px;color:#7A5560}

.prompt-list{list-style:none;margin:0;padding:0}
.prompt-list li{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 15px;margin-bottom:9px;font-size:13px;color:#6B4450}
.prompt-list li .n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--pink);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}

.result-actions{display:flex;gap:10px;margin-top:20px}
.result-actions .btn{flex:1}
.copy-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

.disclaimer{font-size:10.5px;color:#C79AA3;text-align:center;margin-top:18px;padding:0 8px;line-height:1.7}

.site-credit{width:min(480px,100%);margin:26px auto 4px;padding:14px 0 4px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.16em;font-weight:700}
.site-credit span{display:inline-block;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}

@media(max-width:380px){
  .card,.qcard{padding:18px}
  .question{font-size:17.5px}
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- ============ COVER ============ -->
  <section id="screen-cover">
    <div class="cover-top">
      <h1>梦女契合度测试</h1>
      <p class="cover-desc">从心动值、磨合度、占有欲、未来参与度四个维度，测出你和老公到底有多契合。</p>
    </div>

    <div class="name-card">
      <div class="eyebrow">开始之前</div>
      <h3>先填一下你和老公的名字</h3>
      <div class="field"><label>你的昵称</label><input id="nameA" type="text" placeholder="例如：阿念"></div>
      <div class="field"><label>老公的名字</label><input id="nameB" type="text" placeholder="例如：陆时舟"></div>
      <button class="btn" id="startBtn">开始测试</button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="screen-quiz" class="hidden">
    <div class="progressBox">
      <div class="progressTop">
        <span class="who"><i id="whoDot"></i><span id="whoName"></span></span>
        <span id="counter"></span>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="qcard">
      <span class="tag" id="qtag"></span>
      <div class="qnum" id="qnum"></div>
      <div class="question" id="question"></div>
      <div id="options"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="prevBtn">上一题</button>
      <button class="btn btn-primary" id="nextBtn" disabled>下一题</button>
    </div>
  </section>

  <!-- ============ TRANSITION ============ -->
  <section id="screen-transition" class="hidden">
    <div class="trans-card">
      <h2 id="transTitle"></h2>
      <p id="transText"></p>
      <button class="btn" id="transBtn"></button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="hidden">
    <div class="res-hero">
      <div class="eyebrow">契合类型</div>
      <h2 id="resName"></h2>
      <p class="pair" id="resPair"></p>
      <p class="tagline" id="resTagline"></p>
    </div>

    <div class="sectionTitle">关系维度对比</div>
    <div id="dimBlocks"></div>

    <div class="sectionTitle">关系类型分析</div>
    <div class="info-card"><p id="resAnalysis"></p></div>

    <div class="sectionTitle">相处模式</div>
    <div class="info-card"><p id="resGetAlong"></p></div>

    <div class="sectionTitle">摩擦点</div>
    <div class="info-card"><p id="resConflict"></p></div>

    <div class="sectionTitle">情感联结</div>
    <div class="info-card"><p id="resBond"></p></div>

    <div class="sectionTitle">双人专属企划</div>
    <ul class="prompt-list" id="resPrompts"></ul>

    <div class="result-actions">
      <button class="btn btn-ghost" id="restartBtn">重新测试</button>
      <button class="btn btn-primary" id="copyBtn">复制结果</button>
    </div>
    <div class="copy-hint" id="copyHint"></div>

    <p class="disclaimer">测试结果基于你的作答生成，纯属娱乐向的嗑学内容，不代表任何真实人物或角色的官方设定，也不构成对现实关系的评判。适度嗑糖，把美好留在自己的世界里就好。</p>
  </section>

</div>

<footer class="site-credit"><span>@ginyu</span></footer>

<script>
/* ============================================================
   题库（心动值xd / 磨合度mh / 占有欲zy / 未来参与度wl 各4题）
   每题4个选项，选项顺序已手动打乱，val不再按"永远选A最高分"的规律排列
   ============================================================ */
const QUESTIONS=[
 {dim:'xd',tag:'心动值',q:'第一次注意到对方时，TA的感觉是？',o:[
   {t:'心跳漏了一拍，瞬间就记住了对方',v:100},
   {t:'印象还不错，但没什么特别感觉',v:33},
   {t:'无感，跟看其他人没区别',v:0},
   {t:'有点在意，但没到心动的程度',v:66}]},
 {dim:'xd',tag:'心动值',q:'对方不经意的一个小动作，会让TA？',o:[
   {t:'毫无波澜，该干嘛干嘛',v:0},
   {t:'脑子里会不自觉地回放好几次',v:100},
   {t:'愣一下，但很快就抛在脑后',v:33},
   {t:'心里咯噔一下，忍不住想多看两眼',v:66}]},
 {dim:'xd',tag:'心动值',q:'TA陷入心动的速度通常是？',o:[
   {t:'非常快，一个眼神就能沦陷',v:100},
   {t:'需要相处很久，很难真正心动',v:0},
   {t:'中等偏慢，得先确认对方靠谱',v:33},
   {t:'不算快，但一旦确认了就很坚定',v:66}]},
 {dim:'xd',tag:'心动值',q:'面对喜欢的人，TA的表现更接近？',o:[
   {t:'表面正常，其实心里已经翻江倒海',v:66},
   {t:'完全藏不住，眼神动作全写在脸上',v:100},
   {t:'非常克制，绝不会让对方看出端倪',v:0},
   {t:'偶尔会露馅，但大部分时候还算冷静',v:33}]},
 {dim:'mh',tag:'磨合度',q:'两人生活习惯完全不同时，TA会？',o:[
   {t:'很难忍受，摩擦感会一直存在',v:0},
   {t:'努力调整，但需要一定的的适应期',v:33},
   {t:'几乎不当回事，自然而然就顺过去了',v:100},
   {t:'能磨合，只是偶尔还是会别扭',v:66}]},
 {dim:'mh',tag:'磨合度',q:'意见不合的时候，TA更倾向于？',o:[
   {t:'各退一步，很快就能找到共识',v:100},
   {t:'表面让步，其实心里还是别扭',v:33},
   {t:'需要认真沟通好一阵子才能达成一致',v:66},
   {t:'很难达成一致，容易陷入僵持',v:0}]},
 {dim:'mh',tag:'磨合度',q:'跟对方相处的日常节奏，TA感觉？',o:[
   {t:'完全不在一个频道上，总要互相迁就',v:0},
   {t:'轻松自在，像呼吸一样自然',v:100},
   {t:'总体还行，但需要刻意配合一下',v:66},
   {t:'需要不断调整才能对上节奏',v:33}]},
 {dim:'mh',tag:'磨合度',q:'如果对方的喜好和TA完全相反，TA会？',o:[
   {t:'觉得挺有意思，正好互补着来',v:100},
   {t:'尊重但很难真正参与进去',v:66},
   {t:'心里会有点抵触，需要慢慢适应',v:33},
   {t:'很排斥，很难接受差异这么大',v:0}]},
 {dim:'zy',tag:'占有欲',q:'看到对方和别人走得很近，TA的反应是？',o:[
   {t:'心里会有点不是滋味，忍不住多想',v:66},
   {t:'完全不介意，对方有自己的社交很正常',v:0},
   {t:'表面平静，其实已经开始在意细节',v:33},
   {t:'很难压下情绪，会想办法确认清楚',v:100}]},
 {dim:'zy',tag:'占有欲',q:'对方的社交圈子，TA是怎样的态度？',o:[
   {t:'希望自己是对方最特别、最优先的那个',v:100},
   {t:'会关心一下，但不会去干涉',v:33},
   {t:'完全放手，甚至懒得过问',v:0},
   {t:'有一点在意，但不会表现出来',v:66}]},
 {dim:'zy',tag:'占有欲',q:'如果对方没有及时回复消息，TA会？',o:[
   {t:'完全不当回事，忙的时候很正常',v:0},
   {t:'忍不住反复看手机，越想越不安',v:100},
   {t:'心里有点嘀咕，但不会表现出来',v:33},
   {t:'等一会儿再看，稍微有点在意',v:66}]},
 {dim:'zy',tag:'占有欲',q:'TA对"专属感"这件事的需求？',o:[
   {t:'非常需要，很在意"只属于我"这件事',v:100},
   {t:'完全不在意，感情不需要标签化',v:0},
   {t:'有一些需要，但不会强求',v:66},
   {t:'基本不强求，顺其自然就好',v:33}]},
 {dim:'wl',tag:'未来参与度',q:'聊到"以后"这个话题时，TA的态度是？',o:[
   {t:'很认真地会去规划，很看重长期的样子',v:100},
   {t:'愿意聊，但更看重眼前的相处',v:66},
   {t:'能躲就躲，不太想谈这么远',v:0},
   {t:'会想，但没那么迫切要现在就定下来',v:33}]},
 {dim:'wl',tag:'未来参与度',q:'TA更看重感情里的哪一点？',o:[
   {t:'当下这一刻的心动和新鲜感',v:0},
   {t:'两个人能不能一起走得长久',v:100},
   {t:'相处舒不舒服，不想太多以后',v:33},
   {t:'既要眼前开心，也希望能有个未来方向',v:66}]},
 {dim:'wl',tag:'未来参与度',q:'如果遇到长期的现实困难，TA会？',o:[
   {t:'第一反应是想办法一起扛过去',v:100},
   {t:'会努力，但心里也会犹豫要不要继续',v:66},
   {t:'觉得顺其自然，扛不过去就算了',v:0},
   {t:'愿意试试，但没想太长远',v:33}]},
 {dim:'wl',tag:'未来参与度',q:'TA理想中的关系状态更接近？',o:[
   {t:'轻松自由，不被"以后"这种事捆绑',v:0},
   {t:'走一步看一步，暂时不去想太远',v:33},
   {t:'稳步经营，朝着一个共同的方向走',v:66},
   {t:'认定了就是一辈子的事，非TA不可',v:100}]}
];

const DIM_META={
 xd:{name:'心动值',note:'越高代表越容易/越强烈地心动'},
 mh:{name:'磨合度',note:'越高代表相处越顺、摩擦越少'},
 zy:{name:'占有欲',note:'越高代表越在意专属与独占'},
 wl:{name:'未来参与度',note:'越高代表越看重长期与稳定'}
};

/* ---------------- 九种CP契合类型 ---------------- */
const TYPES={
 sparkAtFirstSight:{name:'一眼心动',tagline:'心动来得又快又猛，一个眼神就足够沦陷',
  analysis:'{A}和{B}都是心动值爆表的类型——遇见彼此的那一刻，几乎不需要任何铺垫，心跳就已经先一步给出了答案。这种关系天生自带"命中注定"般的戏剧感。',
  getAlong:'两人的互动带着浓烈的荷尔蒙气息，一个眼神、一次擦肩都能被无限放大成心动瞬间，粘人指数很高。',
  conflict:'心动来得快，理智常常跟不上，容易因为一时冲动做出让彼此都措手不及的决定，事后才后知后觉去收拾局面。',
  bond:'两人的联结建立在"一见如故"的强烈直觉上——不需要漫长的了解，第一眼的心跳就已经说明了一切。',
  prompts:['写一段"初次心动"的小剧场，记录第一次被击中的瞬间','约稿一张"初遇"主题的双人壁纸','做一张记录心动时刻的九宫格纪念图']},
 slowBurn:{name:'细水长流',tagline:'不疾不徐，却在不知不觉间走到了对方心里',
  analysis:'{A}和{B}都不是容易一见钟情的性格，心动来得慢，却在长期的陪伴里生出稳固的默契和归属感，是那种"越处越上头"的类型。',
  getAlong:'相处平淡真实，没有轰轰烈烈的桥段，更多是日常琐碎里的互相惦记，安全感在细节中慢慢累积。',

/* ---------------- 9条公式的占比校准 offset ----------------
   基于3万次均匀随机作答、180轮迭代的蒙特卡洛模拟，拟合加性偏移，
   使 argmax(raw + offset) 在随机样本下的9种类型占比全部逼近 1/9（约11.1%，
   实测最大偏差<0.4%）。若以后改 QUESTIONS 或公式权重，需重新跑模拟更新这些数值。
------------------------------------------------- */
const TYPE_OFFSETS = {
  sparkAtFirstSight: -5.5077,
  slowBurn: -7.724,
  possessiveTug: 3.1938,
  oneSidedCrush: 24.3297,
  plasticCP: -1.7435,
  destinedMatch: 3.8436,
  soulResonance: -15.6222,
  mutualPursuit: -5.3006,
  loveHateBond: 4.5308
};

/* ---------------- 条件抑制项 ----------------
   当满足某类型的典型特征条件时，对与之方向完全相反的类型进行扣分压制，
   降低"两个相反类型同时冲上高分、结果撞车"的概率：
   · 命中注定（三维齐高） ⇄ 塑料CP（三维齐低）
   · 双向奔赴（心动值接近且高，双方均衡） ⇄ 单向暗恋（心动值悬殊）
   · 拉扯占有（心动+占有欲都高） ⇄ 细水长流（心动值低、平稳）
------------------------------------------------- */
const SUPPRESSION_RULES = [
 {cond:(avg,diff,close)=> avg('xd')>=65 && avg('mh')>=65 && avg('wl')>=65, penalize:'plasticCP', amount:26},
 {cond:(avg,diff,close)=> avg('xd')<=35 && avg('mh')<=35 && avg('wl')<=35, penalize:'destinedMatch', amount:26},
 {cond:(avg,diff,close)=> diff('xd')<=15 && avg('xd')>=55, penalize:'oneSidedCrush', amount:22},
 {cond:(avg,diff,close)=> diff('xd')>=50, penalize:'mutualPursuit', amount:22},
 {cond:(avg,diff,close)=> avg('zy')>=65 && avg('xd')>=65, penalize:'slowBurn', amount:18},
 {cond:(avg,diff,close)=> avg('zy')<=35 && avg('xd')<=45, penalize:'possessiveTug', amount:18}
];

/* ---------------- 状态 ---------------- */
const state={names:{A:'你',B:'老公'},currentOC:'A',idx:0,answers:{A:Array(16).fill(null),B:Array(16).fill(null)}};
const $=s=>document.querySelector(s);
const show=id=>{['screen-cover','screen-quiz','screen-transition','screen-result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'smooth'})};

function bindUI(){
$('#startBtn').onclick=()=>{
  const a=$('#nameA').value.trim(), b=$('#nameB').value.trim();
  if(a) state.names.A=a;
  if(b) state.names.B=b;
  state.currentOC='A'; state.idx=0;
  show('screen-quiz'); renderQuestion();
};
}

function renderQuestion(){
  const q=QUESTIONS[state.idx];
  const ans=state.answers[state.currentOC][state.idx];
  const name=state.names[state.currentOC];
  const globalIdx=(state.currentOC==='A'?0:16)+state.idx;
  $('#whoDot').style.background=state.currentOC==='A'?'var(--teal)':'var(--pink)';
  $('#whoName').textContent=`正在为 ${name} 作答`;
  $('#counter').textContent=`${globalIdx+1} / 32`;
  $('#bar').style.width=(globalIdx/32*100)+'%';
  $('#bar').style.background=state.currentOC==='A'?'var(--teal)':'var(--pink)';
  $('#qtag').textContent=q.tag;
  $('#qnum').textContent=`第 ${state.idx+1} / 16 题`;
  $('#question').textContent=q.q.replace(/TA/g,name);
  $('#options').innerHTML=q.o.map((o,i)=>`<button class="option ${ans===i?'selected':''}" data-i="${i}"><span class="idx">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join('');
  document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{state.answers[state.currentOC][state.idx]=+el.dataset.i;renderQuestion();});
  $('#prevBtn').disabled=(state.currentOC==='A'&&state.idx===0);
  $('#nextBtn').disabled=ans===null;
  $('#nextBtn').textContent=state.idx===15?(state.currentOC==='A'?`完成 ${name} 的部分`:'查看契合度测试结果'):'下一题';
}

function bindQuizNav(){
$('#prevBtn').onclick=()=>{
  if(state.idx>0){state.idx--;renderQuestion();}
};
$('#nextBtn').onclick=()=>{
  const ans=state.answers[state.currentOC][state.idx];
  if(ans===null)return;
  if(state.idx<15){state.idx++;renderQuestion();return;}
  if(state.currentOC==='A'){
    $('#transTitle').textContent=`${state.names.A} 的部分完成啦`;
    $('#transText').textContent=`接下来换 ${state.names.B} 登场，用同样的16个问题，看看TA在这段关系里的心动状态。`;
    $('#transBtn').textContent=`开始为 ${state.names.B} 作答`;
    show('screen-transition');
  }else{
    showResult();
  }
};
$('#transBtn').onclick=()=>{state.currentOC='B';state.idx=0;show('screen-quiz');renderQuestion();};
}

/* ---------------- 计分 ---------------- */
function computeScores(oc){
  const ans=state.answers[oc];
  const sums={xd:[],mh:[],zy:[],wl:[]};
  QUESTIONS.forEach((q,i)=>{
    const idx=ans[i];
    sums[q.dim].push(q.o[idx].v);
  });
  const out={};
  Object.keys(sums).forEach(k=>{out[k]=Math.round(sums[k].reduce((x,y)=>x+y,0)/sums[k].length)});
  return out;
}

function determineType(A,B){
  const avg=k=>(A[k]+B[k])/2;
  const diff=k=>Math.abs(A[k]-B[k]);
  const close=k=>100-diff(k);

  const raw={
    sparkAtFirstSight: avg('xd')*.60+close('xd')*.25+avg('wl')*.15,
    slowBurn: (100-avg('xd'))*.35+avg('wl')*.35+close('mh')*.30,
    possessiveTug: avg('zy')*.40+avg('xd')*.35+(100-avg('mh'))*.25,
    oneSidedCrush: diff('xd')*.60+diff('zy')*.40,
    plasticCP: (100-avg('xd'))*.35+(100-avg('mh'))*.35+(100-avg('wl'))*.30,
    destinedMatch: avg('xd')*.30+avg('mh')*.30+avg('wl')*.30+(100-avg('zy'))*.10,
    soulResonance: close('mh')*.35+avg('mh')*.25+close('wl')*.25+avg('wl')*.15,
    mutualPursuit: avg('xd')*.35+avg('wl')*.35+close('zy')*.30,
    loveHateBond: avg('zy')*.30+(100-avg('mh'))*.30+avg('wl')*.25+avg('xd')*.15
  };

  // 条件抑制：命中规则时对目标类型扣分，压制"高分撞车"
  SUPPRESSION_RULES.forEach(rule=>{
    if(rule.cond(avg,diff,close)){ raw[rule.penalize]-=rule.amount; }
  });

  const order=Object.keys(TYPES);
  let best=order[0], bestScore=-Infinity;
  order.forEach((type,i)=>{
    const adjusted = raw[type] + (TYPE_OFFSETS[type] || 0);
    const tie = ((A.xd*3+B.mh*5+A.zy*7+B.wl*11+i*13) % 17) / 100000;
    if(adjusted+tie > bestScore){ bestScore=adjusted+tie; best=type; }
  });
  return best;
}

function fill(t,A,B){return t.replace(/\{A\}/g,A).replace(/\{B\}/g,B)}

function showResult(){
  const A=computeScores('A'), B=computeScores('B');
  const key=determineType(A,B);
  const t=TYPES[key];
  const nameA=state.names.A, nameB=state.names.B;

  $('#resName').textContent=t.name;
  $('#resPair').textContent=`${nameA} × ${nameB}`;
  $('#resTagline').textContent=t.tagline;
  $('#resAnalysis').textContent=fill(t.analysis,nameA,nameB);
  $('#resGetAlong').textContent=fill(t.getAlong,nameA,nameB);
  $('#resConflict').textContent=fill(t.conflict,nameA,nameB);
  $('#resBond').textContent=fill(t.bond,nameA,nameB);
  $('#resPrompts').innerHTML=t.prompts.map((p,i)=>`<li><span class="n">${i+1}</span><span>${fill(p,nameA,nameB)}</span></li>`).join('');

  const order=['xd','mh','zy','wl'];
  $('#dimBlocks').innerHTML=order.map(k=>`
    <div class="dim-block">
      <div class="dim-head"><b>${DIM_META[k].name}</b><span>${DIM_META[k].note}</span></div>
      <div class="dim-row"><span class="who">${nameA}</span><div class="meter teal"><i style="width:${A[k]}%"></i></div><span class="pct">${A[k]}%</span></div>
      <div class="dim-row"><span class="who">${nameB}</span><div class="meter pink"><i style="width:${B[k]}%"></i></div><span class="pct">${B[k]}%</span></div>
    </div>`).join('');

  window._resultText=`《梦女契合度测试》结果\n${nameA} × ${nameB}\n契合类型：${t.name}——${t.tagline}\n\n关系类型分析：${fill(t.analysis,nameA,nameB)}\n\n相处模式：${fill(t.getAlong,nameA,nameB)}\n\n摩擦点：${fill(t.conflict,nameA,nameB)}\n\n情感联结：${fill(t.bond,nameA,nameB)}\n\n双人专属企划：\n${t.prompts.map((p,i)=>(i+1)+'. '+fill(p,nameA,nameB)).join('\n')}\n\n测试结果纯属娱乐向嗑学内容，适度嗑糖，开心就好。`;

  show('screen-result');
}

function bindResult(){
$('#copyBtn').onclick=async()=>{
  const text=window._resultText||'';
  let copied=false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      copied=true;
    }
  }catch(e){}
  if(!copied){
    try{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.left='-9999px';
      ta.style.top='0';
      ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0,ta.value.length);
      copied=document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
  }
  $('#copyHint').textContent=copied?'已复制到剪贴板 ✓':'复制失败，请长按结果文字手动复制';
  setTimeout(()=>$('#copyHint').textContent='',2200);
};
$('#restartBtn').onclick=()=>{
  state.currentOC='A';state.idx=0;
  state.answers={A:Array(16).fill(null),B:Array(16).fill(null)};
  show('screen-cover');
};
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>{bindUI(); bindQuizNav(); bindResult();});
}else{
  bindUI(); bindQuizNav(); bindResult();
}
</script>
